<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ลงเวลาเข้า-ออกงาน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f2f5f9;
    --card: #ffffff;
    --line: #dce4ee;
    --ink: #172231;
    --muted: #7c8798;
    --accent: #2b6cb0;
    --accent-soft: #e1ebf7;
    --green: #1f8a5f;
    --green-soft: #e2f2ea;
    --red: #c0433b;
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Noto Sans Thai', 'Segoe UI', sans-serif;
    background: var(--bg);
    margin: 0;
    padding: 32px 16px 60px;
    color: var(--ink);
    min-height: 100vh;
  }

  .terminal {
    max-width: 380px;
    margin: 0 auto;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }

  .top-line { height: 3px; background: var(--accent); }

  .panel-body { padding: 24px 22px 22px; }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.16em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  .identity {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 22px;
  }
  .avatar {
    width: 48px; height: 48px;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid var(--line);
    flex: none;
    display: none;
  }
  .id-text { min-width: 0; }
  .id-text h2 {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .id-text .sub {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .display {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px 16px;
    text-align: center;
    margin-bottom: 22px;
  }
  .clock {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 32px;
    font-weight: 600;
    color: var(--ink);
    letter-spacing: 0.03em;
    font-variant-numeric: tabular-nums;
  }
  .date {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.04em;
    margin-top: 4px;
  }

  .actions { display: grid; gap: 10px; margin-bottom: 4px; }
  button {
    width: 100%;
    padding: 14px;
    border: 1px solid transparent;
    border-radius: 10px;
    font-family: 'Noto Sans Thai', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: transform 0.12s ease, opacity 0.2s ease;
  }
  button:active:not(:disabled) { transform: scale(0.98); }
  button:disabled { opacity: 0.4; cursor: default; }

  .btn-in {
    background: var(--ink);
    color: #fff;
  }
  .btn-out {
    background: transparent;
    color: var(--red);
    border-color: var(--line);
  }

  .receipt-wrap { margin-top: 18px; }
  .receipt {
    position: relative;
    background: var(--bg);
    color: var(--ink);
    border: 1px dashed var(--line);
    border-radius: 8px;
    padding: 14px 16px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    line-height: 1.7;
  }
  .receipt .headline {
    font-family: 'Noto Sans Thai', sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .receipt .row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    border-top: 1px solid var(--line);
    padding: 5px 0;
  }
  .receipt .row:first-of-type { border-top: none; padding-top: 0; }
  .receipt .row span:first-child { color: var(--muted); }
  .receipt.state-ok .headline { color: var(--green); }
  .receipt.state-warn .headline { color: var(--accent); }
  .receipt.state-err .headline { color: var(--red); }

  .receipt-empty {
    font-family: 'Noto Sans Thai', sans-serif;
    font-size: 12.5px;
    color: var(--muted);
    text-align: center;
    padding: 10px 4px 2px;
  }
</style>
</head>
<body>

<div class="terminal">
  <div class="top-line"></div>
  <div class="panel-body">

    <div class="eyebrow">TIME CLOCK</div>

    <div class="identity">
      <img id="avatar" class="avatar" src="" alt="">
      <div class="id-text">
        <h2 id="name">กำลังโหลด...</h2>
        <div class="sub" id="userid"></div>
      </div>
    </div>

    <div class="display">
      <div class="clock" id="clock">--:--:--</div>
      <div class="date" id="today"></div>
    </div>

    <div class="actions">
      <button class="btn-in" id="btnIn" disabled>✓ เข้างาน · Clock In</button>
      <button class="btn-out" id="btnOut" disabled>● ออกงาน · Clock Out</button>
    </div>

    <div class="receipt-wrap">
      <div id="status" class="receipt-empty">แตะปุ่มด้านบนเพื่อลงเวลา</div>
    </div>

  </div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
  const LIFF_ID = "2010942141-MjvCn4Hn";
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw42KHhCiVyPiCBCs0PdtSA5V4dnyYAu-P9rp8owwlxn2-2eIDR0DJGRZyIbkGzUuXY/exec";

  let profile = null;

  function pad(n) { return n < 10 ? '0' + n : n; }

  function updateClock() {
    const d = new Date();
    document.getElementById('clock').textContent =
      pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    document.getElementById('today').textContent =
      d.toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });
  }
  setInterval(updateClock, 1000);
  updateClock();

  function setStatus(msg) {
    const el = document.getElementById('status');
    const wrap = el.parentElement;
    wrap.innerHTML = '<div id="status" class="receipt-empty">' + msg + '</div>';
  }

  function renderReceipt(action, data) {
    const wrap = document.getElementById('status').parentElement;
    const isOutOfArea = data.inArea === 'ไม่ใช่';
    const state = isOutOfArea ? 'state-warn' : 'state-ok';
    const headline = isOutOfArea
      ? '⚠️ บันทึกแล้ว แต่อยู่นอกพื้นที่'
      : '✓ บันทึก' + (action === 'เข้างาน' ? 'เวลาเข้างาน' : 'เวลาออกงาน') + 'สำเร็จ';

    wrap.innerHTML =
      '<div class="receipt ' + state + '">' +
        '<div class="headline">' + headline + '</div>' +
        '<div class="row"><span>ประเภท</span><span>' + action + '</span></div>' +
        '<div class="row"><span>กะ</span><span>' + (data.shift || '-') + '</span></div>' +
        '<div class="row"><span>สถานะเวลา</span><span>' + (data.statusText || '-') + '</span></div>' +
        '<div class="row"><span>ระยะห่าง</span><span>' + (data.distanceM !== '' ? data.distanceM + ' ม.' : '-') + '</span></div>' +
      '</div>';
  }

  function renderError(msg) {
    const wrap = document.getElementById('status').parentElement;
    wrap.innerHTML =
      '<div class="receipt state-err">' +
        '<div class="headline">✕ เกิดข้อผิดพลาด</div>' +
        '<div class="row"><span>รายละเอียด</span><span>' + msg + '</span></div>' +
      '</div>';
  }

  function getLocation() {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) {
        reject('อุปกรณ์นี้ไม่รองรับ GPS');
        return;
      }
      navigator.geolocation.getCurrentPosition(
        pos => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
        err => reject('กรุณาเปิดสิทธิ์การเข้าถึงตำแหน่ง (GPS) แล้วลองใหม่'),
        { enableHighAccuracy: true, timeout: 10000 }
      );
    });
  }

  async function clockAction(action) {
    document.getElementById('btnIn').disabled = true;
    document.getElementById('btnOut').disabled = true;
    setStatus('กำลังตรวจสอบตำแหน่ง...');

    try {
      const loc = await getLocation();
      setStatus('กำลังบันทึกข้อมูล...');

      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({
          userId: profile.userId,
          displayName: profile.displayName,
          action: action,
          lat: loc.lat,
          lng: loc.lng
        })
      });
      const data = await res.json();

      if (data.status === 'ok') {
        renderReceipt(action, data);
      } else {
        renderError(data.message);
      }
    } catch (e) {
      renderError(typeof e === 'string' ? e : 'กรุณาลองใหม่อีกครั้ง');
    } finally {
      document.getElementById('btnIn').disabled = false;
      document.getElementById('btnOut').disabled = false;
    }
  }

  async function init() {
    try {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }
      profile = await liff.getProfile();

      document.getElementById('name').textContent = profile.displayName;
      document.getElementById('userid').textContent = profile.userId;
      if (profile.pictureUrl) {
        const avatar = document.getElementById('avatar');
        avatar.src = profile.pictureUrl;
        avatar.style.display = 'block';
      }

      document.getElementById('btnIn').disabled = false;
      document.getElementById('btnOut').disabled = false;

      document.getElementById('btnIn').onclick = () => clockAction('เข้างาน');
      document.getElementById('btnOut').onclick = () => clockAction('ออกงาน');

    } catch (err) {
      renderError('ไม่สามารถเชื่อมต่อ LINE ได้: ' + err);
    }
  }

  init();
</script>
</body>
</html>
